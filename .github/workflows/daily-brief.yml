name: Daily brief

on:
  schedule:
    # 07:00 UTC daily — adjust to taste. Cron minutes are UTC regardless of
    # your local timezone.
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  models: read # required for the GitHub Models summarizer

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install personal-brief
        run: pip install -e .

      - name: Run daily brief
        env:
          PERSONAL_BRIEF_CONFIG: config/sources.ci.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: personal-brief run
