# CI variant of sources.yaml — same follow list, trends, and delivery, but
# swaps the summarizer for GitHub Models (free, hosted, no local Ollama
# needed) since GitHub Actions runners can't run a local Ollama model
# realistically. Loaded via PERSONAL_BRIEF_CONFIG in
# .github/workflows/daily-brief.yml. Keep this in sync with sources.yaml by
# hand when you change interests, follow, trends, or discover — only
# `summarizer` is meant to differ.

interests:
  - software architecture
  - AI/ML engineering
  - distributed systems

follow:
  - name: Martin Fowler
    rss: https://martinfowler.com/feed.atom
  - name: Simon Willison
    rss: https://simonwillison.net/atom/everything/
  - name: Julia Evans
    rss: https://jvns.ca/atom.xml
  - name: Kyle Kingsbury (Aphyr)
    rss: https://aphyr.com/posts.atom
  - name: Andrej Karpathy
    rss: https://karpathy.bearblog.dev/feed/?type=rss
  - name: Chris Olah
    rss: https://transformer-circuits.pub/feed.xml
  - name: Lilian Weng
    rss: https://lilianweng.github.io/index.xml
  - name: Jay Alammar
    rss: https://newsletter.languagemodels.co/feed
  - name: Sebastian Raschka
    rss: https://magazine.sebastianraschka.com/feed
  - name: Sebastian Ruder
    rss: https://ruder.io/rss/
  - name: Armin Ronacher
    rss: https://lucumr.pocoo.org/feed.atom
  - name: Eugene Yan
    rss: https://eugeneyan.com/rss/
  - name: Nicholas Carlini
    rss: https://nicholas.carlini.com/writing/feed.xml

trends:
  hackernews:
    min_points: 150
  reddit:
    subreddits:
      - programming
      - ExperiencedDevs
      - LocalLLaMA
      - MachineLearning
    min_upvotes: 200

# CI-only difference from sources.yaml: free, hosted GitHub Models instead of
# local Ollama. Authenticated with the workflow's own GITHUB_TOKEN (see the
# `permissions: models: read` block in daily-brief.yml) — no extra secret.
summarizer:
  provider: github_models
  model: openai/gpt-4o-mini

delivery:
  telegram: true

discover:
  enabled: true
  min_sightings: 3
